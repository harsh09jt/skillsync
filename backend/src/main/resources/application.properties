spring.application.name=backend
spring.config.import=optional:file:./.env[.properties]
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
spring.jpa.open-in-view=false
skillsync.jwt.secret=${SKILLSYNC_JWT_SECRET}
skillsync.jwt.expiration-ms=${SKILLSYNC_JWT_EXPIRATION_MS:3600000}
skillsync.cors.allowed-origin-patterns=${SKILLSYNC_CORS_ALLOWED_ORIGINS:http://localhost:*}
skillsync.ai.api-key=${GEMINI_API_KEY:}
skillsync.ai.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}
skillsync.ai.model=${GEMINI_MODEL:gemini-3.1-flash-lite}